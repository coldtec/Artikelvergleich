<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artikelvergleich</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:#eaf3fa;background:#101c29}*{box-sizing:border-box}body{margin:0;padding:55px 22px;background:radial-gradient(ellipse at 85% 0%,#193345 0%,transparent 48%),#101c29;min-height:100vh}.wrap{max-width:1060px;margin:auto}.eyebrow{color:#4ed1d0;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}h1{font-size:clamp(30px,4vw,42px);letter-spacing:-1.3px;margin:0 0 9px}p{color:#9fb2c4;line-height:1.55;margin:0}.panel{background:#1a2a39;border:1px solid #31495c;border-radius:20px;padding:28px;margin-top:30px;box-shadow:0 18px 50px #06101a36}.uploads{display:grid;grid-template-columns:1fr 1fr;gap:18px}.upload{position:relative;display:block;border:1.5px dashed #49657b;border-radius:15px;background:#142332;min-height:166px;padding:22px;cursor:pointer;transition:.2s}.upload:hover,.upload:focus-within{border-color:#45c9cd;background:#182d3e}.upload input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}.upload .top{display:flex;align-items:center;gap:12px}.upload .ico{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#26495a;color:#63d9dd;font-size:23px}.upload b{font-size:15px}.upload .hint{display:block;margin:16px 0 5px;color:#b5c6d5;font-size:14px}.upload .filename{display:block;color:#6ddbdc;font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.foot{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:23px}.foot small{color:#819bae}.btn{border:0;border-radius:11px;padding:13px 27px;font-size:15px;font-weight:800;background:#39c9ce;color:#092632;cursor:pointer;transition:.2s}.btn:hover{background:#70e1e3;transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:wait}.secondary{padding:11px 18px}.message{margin-top:15px;color:#ffca8b;font-size:14px}.resulthead{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:20px}h2{margin:0;font-size:21px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:23px}.stat{padding:18px;background:#142534;border:1px solid #2d4558;border-radius:13px}.stat span{display:block;color:#a7baca;font-size:13px;margin-bottom:8px}.stat strong{font-size:27px;color:#e8f6fb}.stat:nth-child(2) strong{color:#63d7c3}.stat:nth-child(3) strong{color:#ffbf8d}.tablewrap{overflow:auto;max-height:520px;border:1px solid #30495d;border-radius:12px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #2b4354;text-align:left;padding:12px 15px;white-space:nowrap}th{position:sticky;top:0;background:#243d50;color:#d6e7f2}tr:last-child td{border-bottom:0}tbody tr:hover{background:#23394a}.pill{display:inline-block;border-radius:99px;padding:5px 10px;background:#284e4c;color:#86e7d5;font-weight:700;font-size:12px}.pill.missing{background:#513b37;color:#ffd1b0}#info{margin-bottom:12px;font-size:13px}@media(max-width:650px){body{padding:30px 15px}.panel{padding:18px}.uploads{grid-template-columns:1fr}.foot{align-items:stretch;flex-direction:column}.stats{grid-template-columns:1fr}.resulthead{align-items:stretch}.btn{width:100%}}
</style></head><body><main class="wrap"><div class="eyebrow">COLDTEC TOOL</div><h1>Artikelvergleich</h1><p>Prüfe mit zwei Excel-Dateien, welche Artikel auf dem Shop sind oder nicht.</p><section class="panel"><div class="uploads"><label class="upload"><input id="shop" type="file" accept=".xlsx,.xls,.csv"><span class="top"><span class="ico">▤</span><b>1. Artikelliste Shop</b></span><span class="hint">Datei auswählen oder hier ablegen</span><span class="filename" id="shopname">Excel-Datei (.xlsx, .xls, .csv)</span></label><label class="upload"><input id="other" type="file" accept=".xlsx,.xls,.csv"><span class="top"><span class="ico">▤</span><b>2. Beliebiges Excel</b></span><span class="hint">Datei auswählen oder hier ablegen</span><span class="filename" id="othername">Excel-Datei (.xlsx, .xls, .csv)</span></label></div><div class="foot"><small>Vergleich läuft über Artikelnummer in Spalte A · Beide Spalten A sollten als Text formatiert sein.</small><button class="btn" id="run">Los! →</button></div><div class="message" id="message" role="status"></div></section><section class="panel" id="results" hidden><div class="resulthead"><h2>Dein Ergebnis</h2><button class="btn secondary" id="download">↓ Excel herunterladen</button></div><div class="stats" id="stats"></div><p id="info"></p><div class="tablewrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></section></main><script>
let rows=[],headers=[];const $=id=>document.getElementById(id);function key(v){return String(v??'').trim().replace(/\.0+$/,'').toUpperCase()}async function read(input){const f=input.files[0];if(!f)throw Error('Bitte beide Excel-Dateien auswählen.');const wb=XLSX.read(await f.arrayBuffer(),{type:'array',raw:true});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false,blankrows:false})}function cell(tr,v,tag,status=false){const c=document.createElement(tag);if(status){const pill=document.createElement('span');pill.className='pill'+(v==='Nicht auf dem Shop'?' missing':'');pill.textContent=v;c.append(pill)}else c.textContent=String(v??'');tr.append(c)}for(const id of ['shop','other'])$(id).addEventListener('change',()=>{$(id+'name').textContent=$(id).files[0]?.name||'Excel-Datei (.xlsx, .xls, .csv)';$('results').hidden=true});$('run').onclick=async()=>{const btn=$('run');try{btn.disabled=true;$('message').textContent='Dateien werden verglichen …';if(typeof XLSX==='undefined')throw Error('Excel-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen.');const [shop,other]=await Promise.all([read($('shop')),read($('other'))]);if(!shop.length||!other.length)throw Error('Eine der Dateien ist leer.');headers=other[0];const keys=new Set(shop.slice(1).map(r=>key(r[0])).filter(Boolean));rows=other.slice(1).filter(r=>key(r[0])).map(r=>({values:r,found:keys.has(key(r[0]))}));$('message').textContent='';render()}catch(e){$('message').textContent=e.message;$('results').hidden=true}finally{btn.disabled=false}};function render(){$('results').hidden=false;const present=rows.filter(r=>r.found).length;$('stats').replaceChildren();for(const [label,n] of [['Artikel geprüft',rows.length],['Auf dem Shop',present],['Nicht auf dem Shop',rows.length-present]]){const el=document.createElement('div');el.className='stat';const l=document.createElement('span');l.textContent=label;const b=document.createElement('strong');b.textContent=n.toLocaleString('de-CH');el.append(l,b);$('stats').append(el)}$('info').textContent=rows.length>500?'Vorschau der ersten 500 Artikel. Der Export enthält alle Ergebnisse.':'';const h=document.createElement('tr');headers.forEach(v=>cell(h,v,'th'));cell(h,'Shopstatus','th');$('head').replaceChildren(h);const frag=document.createDocumentFragment();for(const r of rows.slice(0,500)){const tr=document.createElement('tr');for(let i=0;i<headers.length;i++)cell(tr,r.values[i],'td');cell(tr,r.found?'Auf dem Shop':'Nicht auf dem Shop','td',true);frag.append(tr)}$('body').replaceChildren(frag)}$('download').onclick=()=>{const data=[[...headers,'Shopstatus'],...rows.map(r=>[...headers.map((_,i)=>r.values[i]??''),r.found?'Auf dem Shop':'Nicht auf dem Shop'])];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(data),'Artikelvergleich');XLSX.writeFile(wb,'Artikelvergleich_Status.xlsx')};
</script></body></html>
